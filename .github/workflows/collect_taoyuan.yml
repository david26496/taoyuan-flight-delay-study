name: Collect Taoyuan flight snapshots

on:
  schedule:
    # UTC -> Asia/Taipei: 00:07, 06:07, 12:07, 18:07.
    # September 22 00:07 is the one supplementary run; Python gates the year/window.
    - cron: '7 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight-research-data-writer
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect original bytes
        id: collect
        run: python scripts/collect_taoyuan.py
      - name: Commit new snapshots and audit logs
        if: ${{ always() && !cancelled() && steps.collect.outcome != 'skipped' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/persist_snapshots.sh taoyuan
      - name: Preserve evidence if collection or push failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taoyuan-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            raw/taoyuan/
            logs/taoyuan/
          if-no-files-found: ignore
          retention-days: 14
