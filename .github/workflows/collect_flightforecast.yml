name: Collect Taoyuan flights and hourly passenger forecasts

on:
  workflow_dispatch:
    inputs:
      force_taoyuan:
        description: "Also collect airport flight data for manual validation"
        type: boolean
        default: false
      trigger_source:
        description: 'Who initiated this collection'
        type: choice
        default: manual
        options:
          - manual
          - cron-job.org

permissions:
  contents: read

concurrency:
  group: taoyuan-flightforecast
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Decide whether airport snapshot is due
        id: due
        env:
          FORCE_TAOYUAN: ${{ inputs.force_taoyuan || false }}
        run: python -B scripts/flight_snapshot_due.py
      - name: Install forecast reader
        run: python -m pip install -r requirements-flightforecast.txt
      - name: Collect official forecast files
        id: collect
        env:
          COLLECTION_TRIGGER: ${{ inputs.trigger_source || github.event_name }}
        run: python -B scripts/collect_flightforecast.py
      - name: Commit new snapshots and audit logs
        if: ${{ always() && !cancelled() && steps.collect.outcome != 'skipped' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/persist_forecast.sh taoyuan_forecast
      - name: Collect airport flight snapshot
        id: flight_collect
        if: ${{ always() && !cancelled() && steps.due.outputs.due == 'true' }}
        env:
          COLLECTION_TRIGGER: ${{ inputs.trigger_source || github.event_name }}
        run: python -B scripts/collect_taoyuan.py
      - name: Commit airport snapshots and audit logs
        if: ${{ always() && !cancelled() && steps.flight_collect.outcome != 'skipped' }}
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/persist_snapshots.sh taoyuan
      - name: Preserve evidence if collection or push failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flightforecast-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            raw/taoyuan_forecast/
            logs/taoyuan_forecast/
            raw/taoyuan/
            logs/taoyuan/
          if-no-files-found: ignore
          retention-days: 14
