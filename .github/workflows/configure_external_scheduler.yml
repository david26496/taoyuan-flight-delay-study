name: Configure external cloud scheduler
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan: preview; provision: create/update study jobs; status: read execution history'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - provision
          - status
permissions:
  contents: read
concurrency:
  group: external-scheduler-configuration
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Configure or inspect study jobs
        env:
          MODE: ${{ inputs.mode }}
          CRON_JOB_API_KEY: ${{ secrets.CRON_JOB_API_KEY }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: python scripts/configure_external_scheduler.py "$MODE"
